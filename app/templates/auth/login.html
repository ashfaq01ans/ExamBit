{% extends "base.html" %}
{% block title %}Log in - ExamBit{% endblock %}
{% block content %}
<div class="card auth-card">
<h1>Welcome back</h1>
<p class="muted">Log in to take or manage exams.</p>
<form method="post">
  <p>
    <label for="email">Email</label><br>
    <input type="email" id="email" name="email" value="{{ email }}" required>
  </p>
  <p>
    <label for="password">Password</label><br>
    <span class="pw-field">
      <input type="password" id="password" name="password" required>
      <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">
        <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </span>
  </p>
  <p><button type="submit" class="btn btn-primary btn-block">Log in</button></p>
</form>
<p class="muted auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
